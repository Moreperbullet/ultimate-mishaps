#unit descriptions
unit.mishaps-relayer.description = Fires slow laser bolts at enemy targets. Dodges damage.
unit.mishaps-announcer.description = Fires small railgun bullets at enemy targets. Dodges damage.
unit.mishaps-agent.description = Fires arcs of electricity at enemy targets. Capable of invisiblity.
unit.mishaps-attorney.description = Fires bursts of charged bullets at enemy targets. Capable of invisiblity.
unit.mishaps-magistrate.description = Fires a massive artillery shell at enemy targets. Capable of dodging.
unit.mishaps-aphid.description = Fires three homing bullets at enemy targets.
unit.mishaps-acyrtho.description = Fires small homing missiles at enemy targets.
unit.mishaps-mindarus.description = Fires swarms of sapping missiles at enemy targets.
unit.mishaps-rhophalo.description = Fires salvos of sapping bullets at enemy targets. Pulls enemies with 2 autonomous tractor beam turrets.
unit.mishaps-toxoptera.description = Fires large bullets at enemy targets. Pulls enemies with 4 autonomous tractor beam turrets.

