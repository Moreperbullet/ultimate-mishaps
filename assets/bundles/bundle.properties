#block descriptions
block.mishaps-large-payload-conveyor.description = Moves gigantic payloads, such as units from factories.
block.mishaps-payload-builder.description = Fabricates select structures up to 2x2 tiles in size.
block.mishaps-payload-breaker.description = Deconstructs inputted structures and units. Returns 100% of the build cost.
block.mishaps-payload-propulsion-tower.description = Long-range payload transport structure. Shoots payloads to other linked payload propulsion towers.

block.mishaps-plastanium-crusher.description = Produces more plastanium by consuming high amounts of oil and titanium.
block.mishaps-disease-mixer.description = Combines a handful of disease fragments into a disease vector.
block.mishaps-disease-extractor.description = Extracts rare amount of disease fragments from slag.
block.mishaps-surge-link.description = An extreme-distance power node. Can only connect to other surge links.
block.mishaps-plastanium-deflect-wall.description = Protects structures from enemy projectiles, telepathically reflects damage from enemy bullets to their owners.
block.mishaps-plastanium-deflect-wall-large.description = Protects structures from enemy projectiles, telepathically reflects damage from enemy bullets to their owners.
block.mishaps-aquamarine-wall.description = Protects structures from enemy projectiles.
block.mishaps-aquamarine-wall-large.description = Protects structures from enemy projectiles.
block.mishaps-density-projector.description = Creates an octagonal force field around itself, protecting buildings and units inside from damage. For each phase, as fractions of remaining health; its shield armor increases.
block.mishaps-vampirism.description = Fires sapping laser beams at enemy targets.
block.mishaps-devastation.description = Fires three massive incendiary laser blasts that damage and burn enemy targets.

block.mishaps-plastanium-deflect-wall.details = Do you ever wonder why Segments attack bullets?
block.mishaps-devastation.details = Formerly experimental technology. Once coexisted with its contender: the Foreshadow, until this prototype was rejected overall.

